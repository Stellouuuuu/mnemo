# Base PostgreSQL de développement pour Mnemo, avec l'extension pgvector (recherche dans les documents).
#   docker compose up -d db
#   DATABASE_URL=postgresql://mnemo:mnemo@127.0.0.1:5435/mnemo   (dans backend/.env, avec MEMORY_STORE=postgres)
#   cd backend && npm run db:migrate
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mnemo
      POSTGRES_PASSWORD: mnemo
      POSTGRES_DB: mnemo
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - mnemo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemo -d mnemo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mnemo-data:
